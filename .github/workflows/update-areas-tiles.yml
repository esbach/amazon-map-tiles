name: Update areas tiles from Supabase

on:
  # run once per day at 08:00 UTC (~midnight US Pacific)
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install

      - name: Install Tippecanoe
        run: |
          python -m pip install --upgrade pip
          python -m pip install tippecanoe

      - name: Fetch GeoJSON from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: npm run fetch-geojson

      - name: Build tiles with Tippecanoe
        run: npm run build-tiles

      - name: Commit and push if there are changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add areas/areas.geojson areas/areas.pmtiles

          git commit -m "Update areas tiles from Supabase ($(date -u +"%Y-%m-%dT%H:%M:%SZ"))" || exit 0
          git push
